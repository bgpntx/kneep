# HTTP → HTTPS redirect
server {
    listen 80;
    listen [::]:80;
    server_name nest.vps.pw;
    return 301 https://$host$request_uri;
}

# Jukebox Web Interface on port 8443
server {
    listen 8443 ssl;
    listen [::]:8443 ssl;
    http2 on;
    server_name nest.vps.pw;

    ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    root /usr/share/nginx/html;
    index index.html;

    # Proxy API calls to Navidrome
    location /rest/ {
        proxy_pass http://navidrome:4533/rest/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        
        add_header Access-Control-Allow-Origin "https://nest.vps.pw:8443" always;
        add_header Access-Control-Allow-Methods "GET, POST, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Content-Type, Authorization" always;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
}

# Navidrome Full Interface on port 4533 with HTTPS
server {
    listen 4533 ssl;
    listen [::]:4533 ssl;
    http2 on;
    server_name nest.vps.pw;

    ssl_certificate     /etc/nginx/ssl/fullchain.pem;
    ssl_certificate_key /etc/nginx/ssl/privkey.pem;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers on;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Proxy everything to Navidrome
    location / {
        proxy_pass http://navidrome:4533;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Forwarded-Host $host:4533;
        
        # WebSocket support (for real-time updates)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        
        # Increase timeouts for streaming
        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
    }
}
